<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Iman Anvari</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Newsreader:ital,opsz,wght@1,6..72,400&family=DM+Mono&display=swap">
<style>
/* single centered column, name over a loose stack of hand-set links, email at the foot */
:root{
  --paper:#f6f5f1; --ink:#1b1a17; --soft:#6d6a62; --line:#1b1a1740;
  --display:"Playfair Display",Georgia,serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121210;--ink:#ecebe5;--soft:#9a978e;--line:#ecebe540;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121210;--ink:#ecebe5;--soft:#9a978e;--line:#ecebe540;color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);transition:background .4s,color .4s}
main{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2rem;text-align:center;
  padding-block:4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,9vw,4.6rem);line-height:1;margin:0;letter-spacing:-.01em}
nav{display:flex;flex-direction:column;align-items:center;gap:.9rem}
a{color:inherit;text-decoration:none}
nav a{font-style:italic;font-size:clamp(1.25rem,4vw,1.6rem);line-height:1.2;border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .3s}
nav a:hover,nav a:focus-visible{border-color:var(--line)}
a:focus-visible,button:focus-visible{outline:1px dashed var(--ink);outline-offset:4px}
.mail{font-family:var(--mono);font-size:.85rem;color:var(--soft);user-select:all}
.mail:hover{color:var(--ink)}
.namewrap{position:relative;display:flex;align-items:flex-end;gap:.15em;font-size:clamp(2.6rem,9vw,4.6rem)}
.flower{width:.55em;height:1.25em;color:var(--ink);transform-origin:50% 100%;flex:none;margin-bottom:-.12em}
.butterfly{position:absolute;left:0;top:0;width:.42em;height:.36em;color:var(--ink);pointer-events:none}
.wl,.wr{transform-box:fill-box}
.wl{transform-origin:100% 50%}.wr{transform-origin:0 50%}
.l{display:inline-block;white-space:pre;will-change:transform}
.theme{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
  width:22px;height:22px;border-radius:50%;border:1px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);cursor:pointer;padding:0}
</style>

<button class="theme" id="theme" aria-label="Switch light or dark"></button>
<main>
  <div class="namewrap">
    <svg class="flower" viewBox="0 0 40 90" aria-hidden="true">
      <path d="M20 90 C 18 70, 23 55, 20 32" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M20 66 C 10 60, 7 52, 9 48 C 15 50, 19 57, 20 66Z" fill="currentColor" opacity=".55"/>
      <g class="bloom-head" transform="translate(20 26)">
        <g fill="none" stroke="currentColor" stroke-width="1.4">
          <ellipse rx="5" ry="9" transform="translate(0 -9)"/>
          <ellipse rx="5" ry="9" transform="rotate(72) translate(0 -9)"/>
          <ellipse rx="5" ry="9" transform="rotate(144) translate(0 -9)"/>
          <ellipse rx="5" ry="9" transform="rotate(216) translate(0 -9)"/>
          <ellipse rx="5" ry="9" transform="rotate(288) translate(0 -9)"/>
        </g>
        <circle r="3.2" fill="currentColor"/>
      </g>
    </svg>
    <h1 data-anim="sway">Iman Anvari</h1>
    <svg class="butterfly" viewBox="-14 -12 28 24" aria-hidden="true">
      <g class="wings" fill="currentColor">
        <path class="wl" d="M0 0 C -4 -10, -14 -12, -12 -2 C -11 3, -4 3, 0 0 C -3 4, -10 9, -6 10 C -3 11, -1 5, 0 0Z"/>
        <path class="wr" d="M0 0 C 4 -10, 14 -12, 12 -2 C 11 3, 4 3, 0 0 C 3 4, 10 9, 6 10 C 3 11, 1 5, 0 0Z"/>
      </g>
      <path d="M0 -5 L0 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </div>
  <nav>
    <a href="https://esoterorist.github.io/Orpheus/" data-anim="lookback">Orpheus</a>
    <a href="#" data-anim="grid">Diagram Museum</a>
    <a href="https://esoterorist.github.io/Saadi/" data-anim="caravan">سفرهای سعدی</a>
    <a href="#" data-anim="bloom">Epicycle</a>
    <a href="https://github.com/esoterorist/calender" data-anim="tick">imz Calender</a>
    <a href="https://are.na/i-a-tm-ild_dlli" data-anim="tide">Are.na</a>
  </nav>
  <a class="mail" href="mailto:iiman.anvarii@gmail.com" data-anim="type">iiman.anvarii@gmail.com</a>
</main>

<script>
(()=>{
  const root=document.documentElement;
  try{const t=localStorage.getItem("theme");if(t)root.dataset.theme=t}catch(e){}
  document.getElementById("theme").onclick=()=>{
    const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme=dark?"light":"dark";
    try{localStorage.setItem("theme",root.dataset.theme)}catch(e){}
  };

  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const items=[];
  document.querySelectorAll("[data-anim]").forEach(el=>{
    const rtl=/[؀-ۿ]/.test(el.textContent);
    if(rtl){items.push({el,kind:el.dataset.anim,letters:[el],rtl:true});el.classList.add("l");return}
    const txt=el.textContent;el.textContent="";
    const letters=[...txt].map(ch=>{const s=document.createElement("span");s.className="l";s.textContent=ch;el.appendChild(s);return s});
    el.setAttribute("aria-label",txt);
    items.push({el,kind:el.dataset.anim,letters,hover:0});
    el.addEventListener("mouseenter",()=>items.find(i=>i.el===el).hover=1);
    el.addEventListener("mouseleave",()=>items.find(i=>i.el===el).hover=0);
  });
  if(reduce)return;

  const anims={
    // name: stems in a light wind
    sway:(s,i,t,n,h)=>`rotate(${Math.sin(t*1.1+i*.5)*(3+h*6)}deg) translateY(${Math.sin(t*1.3+i*.7)*1.5}px)`,
    // Orpheus: one letter at a time turns back and sinks
    lookback:(s,i,t,n,h)=>{const p=((t*.5)%(n+3))-i;const k=p>0&&p<1.5?Math.sin(p/1.5*Math.PI):0;
      s.style.opacity=1-k*.55;return `scaleX(${1-2*k*(.5+h*.5)}) translateY(${k*6}px)`},
    // diagrams: letters snap to a grid
    grid:(s,i,t,n,h)=>{const step=Math.floor(t*1.5+i*.37)%4;const d=[[0,0],[0,-3],[3,0],[0,3]][step];const m=1+h*2;return `translate(${d[0]*m}px,${d[1]*m}px)`},
    // type garden: letters bloom upward in turn
    bloom:(s,i,t,n,h)=>{const k=(Math.sin(t*1.6-i*.6)+1)/2;return `translateY(${-k*(4+h*6)}px) scale(${1+k*.12}) rotate(${(k-.5)*6}deg)`},
    // calendar: letters flip like days
    tick:(s,i,t,n,h)=>{const p=(t*1.2+i*.15)%n;const k=Math.max(0,1-Math.abs(p-i)*1.6);return `rotateX(${k*(160+h*20)}deg)`},
    // cycle: a slow moon tide
    tide:(s,i,t,n,h)=>`translateY(${Math.sin(t*.7+i*(Math.PI*2/n))*(4+h*4)}px)`,
    // email: a typewriter caret carriage
    type:(s,i,t,n,h)=>{const p=(t*6)%(n+12);s.style.opacity=i<p?1:.25;return ""}
  };
  const wrap=document.querySelector(".namewrap"),fl=document.querySelector(".flower"),
        head=document.querySelector(".bloom-head"),bf=document.querySelector(".butterfly"),
        wl=bf.querySelector(".wl"),wr=bf.querySelector(".wr");
  function frame(ms){
    const t=ms/1000;
    // flower sways, head turns slowly
    fl.style.transform=`rotate(${Math.sin(t*1.1)*4}deg)`;
    head.setAttribute("transform",`translate(20 26) rotate(${t*12%360})`);
    // butterfly: lazy figure-eight over the name, landing on the flower now and then
    const W=wrap.offsetWidth,H=wrap.offsetHeight,cyc=t%14;
    let x,y,flap=1;
    if(cyc<10){const a=t*.63;x=W*.55+Math.sin(a)*W*.45;y=-H*.25+Math.sin(a*2)*H*.35}
    else{const k=Math.min(1,(cyc-10)/1.2),a=t*.63;const fx=fl.offsetLeft+fl.offsetWidth*.3,fy=fl.offsetTop-bf.offsetHeight*.4;
      const sx=W*.55+Math.sin(a)*W*.45,sy=-H*.25+Math.sin(a*2)*H*.35;
      x=sx+(fx-sx)*k;y=sy+(fy-sy)*k;flap=k>=1?.25:1}
    const w=Math.abs(Math.sin(t*(flap>.5?18:4)))*.75*flap+.25;
    wl.style.transform=`scaleX(${w})`;wr.style.transform=`scaleX(${w})`;
    bf.style.transform=`translate(${x-bf.offsetWidth/2}px,${y}px) rotate(${Math.cos(t*.63)*15}deg)`;
    for(const it of items){
      if(it.rtl){ // Saadi: whole word walks like a caravan, right to left
        it.el.style.transform=`translateX(${Math.sin(t*.5)*8}px) translateY(${Math.abs(Math.sin(t*2.2))*-2}px)`;continue}
      const f=anims[it.kind],n=it.letters.length;
      it.letters.forEach((s,i)=>{s.style.transform=f(s,i,t,n,it.hover)});
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
