<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iman Anvari</title>
<meta name="description" content="Iman Anvari — projects &amp; experiments, 2026.">
<meta name="theme-color" content="#2108c9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@400;700&family=IBM+Plex+Mono&family=Noto+Naskh+Arabic:wght@700&display=swap">
<style>
/* a golden rectangle, squares shrinking by φ, turning forever around its eye */
:root{
  --paper:#2108c9; --ink:#fff; --soft:#c9c2ff; --loop:#b9b0ff;
  --display:"Instrument Serif","Times New Roman",Georgia,serif;
  --body:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --naskh:"Noto Naskh Arabic","Geeza Pro",Tahoma,serif;
  --spring:cubic-bezier(.3,1.5,.5,1);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0d0458;--soft:#a79ef0;--loop:#6f62e0}}
:root[data-theme="dark"]{--paper:#0d0458;--soft:#a79ef0;--loop:#6f62e0}

html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;transition:background .618s}

#geo{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;color:var(--loop);contain:strict}
#geo rect{fill:none;stroke:currentColor;stroke-width:1;stroke-dasharray:2 7;vector-effect:non-scaling-stroke;opacity:.6}
#spiral{fill:none;stroke:var(--ink);stroke-width:1.25;stroke-dasharray:14 9;vector-effect:non-scaling-stroke;animation:march 40s linear infinite}
@keyframes march{to{stroke-dashoffset:-460}}

#stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;contain:strict}
.sq{position:absolute;left:0;top:0;width:1000px;height:1000px;transform-origin:0 0;contain:strict}
.rot{position:absolute;inset:0;overflow:hidden}
.card{position:absolute;inset:0;transition:opacity .618s}
.card.past{opacity:.22}
.sq.nav{cursor:pointer}

/* the links — 1000 design px per square */
.t{position:absolute;left:64px;bottom:150px;font:700 120px/1 var(--body);letter-spacing:-.04em;color:var(--ink);text-decoration:none;white-space:nowrap}
.t .w{position:relative;display:inline-block}
.t.name{font:400 236px/.9 var(--display);letter-spacing:-.03em}
.t.fa{left:auto;right:64px;font:700 120px/1.2 var(--naskh);letter-spacing:0}
.tag{position:absolute;left:.04em;bottom:100%;margin-bottom:.12em;font:400 26px/1 var(--mono);letter-spacing:.08em;color:var(--soft)}
.small{position:absolute;left:64px;bottom:88px;font:400 30px/1 var(--mono);color:var(--soft);text-decoration:none;white-space:nowrap}
.small.r{left:auto;right:64px}
a.small::after{content:"";display:inline-block;width:0;margin-left:14px;vertical-align:middle;border-top:2px dashed currentColor;transition:width .618s var(--spring)}
a.small:hover{color:var(--ink)}a.small:hover::after{width:110px}

/* elsewhere: a short stack of links */
.list{position:absolute;left:64px;bottom:150px}
.list .tag{position:static;display:block;margin:0 0 22px .04em}
.list .t{position:relative;left:auto;bottom:auto;display:block;width:max-content;font-size:100px;line-height:1.12}

/* what grows out of each link */
.g{position:absolute;overflow:visible;pointer-events:none}
.g .s{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.g .o{fill:none;stroke:var(--ink);stroke-width:2.5}
.g .f{fill:var(--ink)}
.g .c.o,.g .o.k{fill:var(--paper)}
.d{stroke-dasharray:1 2;stroke-dashoffset:1.001;transition:stroke-dashoffset .382s ease}
.p{transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform .382s ease}
.c{opacity:0;transform-box:view-box;transform-origin:4px 128px;transition:transform .382s ease,opacity .2s}
.ghost{position:absolute;left:0;top:100%;opacity:.3;pointer-events:none;transform-origin:0 0;transform:scale(1,0) translateY(-100%);transition:transform .382s ease;
  -webkit-mask-image:linear-gradient(to bottom,transparent 10%,#000);mask-image:linear-gradient(to bottom,transparent 10%,#000)}
.orb,.orb2,.ph,.pg{transform-box:view-box}
.orb{transform-origin:57px 57px}.orb2{transform-origin:91px 57px}

.card.on .d,.t:hover .d{stroke-dashoffset:0;transition:stroke-dashoffset 1s cubic-bezier(.6,0,.2,1) calc(var(--i,0) * .08s + .12s)}
.card.on .p,.t:hover .p{transform:scale(1);transition:transform .618s var(--spring) calc(var(--i,0) * .05s + .2s)}
.card.on .c,.t:hover .c{opacity:1;transform:rotate(var(--a));transition:transform .9s var(--spring) calc(var(--i) * .06s + .1s),opacity .2s calc(var(--i) * .06s + .1s)}
.card.on .ghost,.t:hover .ghost{transform:scale(1,-1) translateY(-100%);transition:transform 1s var(--spring) .12s}
.card.on .orb,.t:hover .orb{animation:spin 6.18s linear infinite}
.trig{opacity:0}
.card.on .trig,.t:hover .trig{animation:trig 1.6s steps(1) infinite;animation-delay:calc(var(--d) + .9s)}
@keyframes trig{0%{opacity:1}12%,100%{opacity:0}}
.card.on .orb2,.t:hover .orb2{animation:spin 3.82s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
/* sankofa: a playhead that only ever goes back */
.ph{opacity:0}
.card.on .ph,.t:hover .ph{animation:back 2.4s cubic-bezier(.5,0,.5,1) 1.1s infinite}
@keyframes back{0%{opacity:0;transform:translateX(124px)}12%,85%{opacity:1}100%{opacity:0;transform:translateX(4px)}}
/* spotify: waves pulse outward */
.card.on .wv,.t:hover .wv{animation:wave 1.8s ease-in-out infinite;animation-delay:calc(var(--d) + 1.1s)}
@keyframes wave{0%,100%{opacity:1}50%{opacity:.28}}
/* goodreads: pages turn, once each */
.pg{opacity:0;transform-origin:60px 50px}
.card.on .pg,.t:hover .pg{animation:flip .9s cubic-bezier(.5,0,.3,1) both;animation-delay:calc(var(--d) + 1s)}
@keyframes flip{0%{opacity:1;transform:scaleX(1)}100%{opacity:1;transform:scaleX(-1)}}

/* the name: its I becomes a plant, and the plant takes the rest of the name */
.name .bl{display:inline-block;width:0;height:0}
.name .I{transition:color .35s}
.card.on .name .I,.t.name:hover .I{color:transparent;transition:color .8s ease .3s}
.vine{left:0;top:0;width:100%;height:100%}
.vine .vn,.vine .hl{fill:none;stroke-linecap:round;stroke-linejoin:round}
.vine .vn{stroke:var(--ink)}
.vine .hl{stroke:var(--paper)}
.vine .lb{fill:var(--ink);stroke:var(--paper);paint-order:stroke}
.vine .rb{fill:none;stroke:var(--paper);stroke-linecap:round}
.vine .pt{fill:var(--paper);stroke:var(--ink)}
.vine .fc,.vine .sd{fill:var(--ink)}
.vine .bd{fill:var(--paper)}
.vine .lf{transform-origin:0 50%}
.vine .fl{transform:scale(0) rotate(-72deg)}
.vine .d{transition:stroke-dashoffset .45s ease}
.vine .p{transition:transform .35s ease}
.card.on .vine .d,.t:hover .vine .d{transition:stroke-dashoffset var(--dur,.6s) var(--ez,cubic-bezier(.5,0,.3,1)) var(--t,0s)}
.card.on .vine .p,.t:hover .vine .p{transition:transform .8s var(--spring) var(--t,0s)}
.card.on .vine .fl,.t:hover .vine .fl{transform:scale(1) rotate(0deg)}

/* light/dark: a single dot — solid by day, a ring by night */
.theme{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));
  width:36px;height:36px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.theme::before{content:"";width:12px;height:12px;border-radius:50%;box-sizing:border-box;border:1.5px solid var(--ink);background:var(--ink);
  transition:background .382s,transform .618s var(--spring)}
.theme:hover::before{transform:scale(1.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme::before{background:transparent}}
:root[data-theme="dark"] .theme::before{background:transparent}
.theme:focus-visible,.t:focus-visible,.small:focus-visible{outline:2px dashed var(--ink);outline-offset:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){#spiral{animation:none}*{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}}
</style>
</head>

<noscript><style>#links{position:static;width:auto;height:auto;clip:auto;display:flex;flex-direction:column;gap:14px;padding:40px;font:700 26px var(--body)}#links a{color:#fff}</style></noscript>

<script>
(()=>{
/* ---------- the golden function ---------- */
const PHI=(1+Math.sqrt(5))/2, HP=Math.PI/2, GA=Math.PI*(3-Math.sqrt(5)), LN=Math.log(PHI);
const D=1+1/(PHI*PHI), P={x:PHI/D,y:1/D}, V0={x:-P.x,y:1-P.y};   // P: the eye, where every square converges
const mod=(a,n)=>((a%n)+n)%n, f5=v=>+v.toFixed(5), f1=v=>v.toFixed(1);
const rot=(a,v)=>{const c=Math.cos(a),s=Math.sin(a);return{x:c*v.x-s*v.y,y:s*v.x+c*v.y}};
const Tk=(k,v)=>{const sc=PHI**-k,r=rot(k*HP,{x:v.x-P.x,y:v.y-P.y});return{x:P.x+sc*r.x,y:P.y+sc*r.y}};
const spiral=s=>{const sc=PHI**-s,r=rot(s*HP,V0);return{x:P.x+sc*r.x,y:P.y+sc*r.y}};
const V1={x:-LN*V0.x-HP*V0.y,y:-LN*V0.y+HP*V0.x};                 // d/ds of the spiral, before scale + turn
const spiralD=s=>{const sc=PHI**-s,r=rot(s*HP,V1);return{x:sc*r.x,y:sc*r.y}};
const squareK=k=>{const a=Tk(k,{x:0,y:0}),b=Tk(k,{x:1,y:1});return{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)}};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=s=>document.querySelector(s);

/* ---------- what grows, per link (1 unit = 1 design px at the base size) ---------- */
const svg=(style,vb,body)=>`<svg class="g" style="${style}" viewBox="${vb}" aria-hidden="true">${body}</svg>`;
const G={
  // sixteen slices of a sound, cut into four, and a playhead that walks back to fetch it
  sankofa(){const A=[.95,.58,.8,.42,.72,.5,.64,.3,.88,.44,.56,.34,.62,.26,.4,.18];let h="";
    A.forEach((a,i)=>{const hh=84*a;h+=`<rect class="f p" style="--i:${(i*.45).toFixed(2)}" x="${4+i*8}" y="${f1(56-hh/2)}" width="4.6" height="${f1(hh)}" rx="2.3"/>`});
    for(let j=1;j<4;j++)h+=`<path class="s d" pathLength="1" style="--i:${4+j*2};stroke-width:2;opacity:.55" d="M${f1(2.3+j*32)} 98V12"/><path class="f p" style="--i:${8+j*1.5}" d="M${f1(-3.7+j*32)} 4h12l-6 7z"/>`;
    return svg("left:100%;bottom:.04em;margin-left:.12em;width:1.32em;height:1em","0 0 132 100",
      h+`<g class="ph"><path class="s" style="stroke-width:3.5" d="M0 8V104"/><circle class="f" cx="0" cy="104" r="5"/></g>`)},
  // seven cards fan out
  cards(){let h="";for(let i=0;i<7;i++)h+=`<rect class="c ${i===6?"f":"o"}" style="--i:${i};--a:${i*7}deg" x="4" y="73" width="34" height="55" rx="3"/>`;
    return svg("left:100%;bottom:.04em;margin-left:.1em;width:1.25em;height:1.45em","0 0 114 132",h)},
  // six hex trigs pop up, then fire in a pattern
  hex(){const C=[[20,100],[52,100],[84,100],[36,72],[68,72],[52,44]],D=[0,.8,.4,1.2,.2,1],
      hp=(x,y,r)=>"M"+[0,1,2,3,4,5].map(k=>{const a=(k*60-90)*Math.PI/180;return f1(x+r*Math.cos(a))+","+f1(y+r*Math.sin(a))}).join("L")+"Z";
    return svg("left:100%;bottom:.04em;margin-left:.12em;width:.88em;height:1em","0 0 106 120",
      C.map((c,i)=>`<path class="o p" style="--i:${i*1.2}" d="${hp(c[0],c[1],16)}"/><path class="f trig" style="--d:${D[i]}s" d="${hp(c[0],c[1],10)}"/>`).join(""))},
  // a little diagram draws itself
  diagram(){const A=[14,100],B=[70,16],C=[142,64],Dd=[80,80],e=[[A,B],[B,C],[C,Dd],[Dd,A],[B,Dd]];
    return svg("right:0;bottom:100%;margin-bottom:.06em;width:1.3em;height:.95em","0 0 156 114",
      e.map((p,i)=>`<path class="s d" pathLength="1" style="--i:${i}" d="M${p[0]}L${p[1]}"/>`).join("")+
      `<circle class="f p" style="--i:0" cx="14" cy="100" r="7"/><rect class="f p" style="--i:2" x="63" y="9" width="14" height="14"/><circle class="o p" style="--i:4" cx="142" cy="64" r="8"/><circle class="f p" style="--i:6" cx="80" cy="80" r="5"/>`)},
  // a caravan of dots wanders off toward a far city
  route(){let h="";const q=t=>{const u=1-t;return[u*u*256+2*u*t*150+t*t*14,u*u*124+2*u*t*20+t*t*24]};
    for(let i=0;i<=15;i++){const p=q(i/15);h+=`<circle class="f p" style="--i:${i}" cx="${f1(p[0])}" cy="${f1(p[1])}" r="${i?3.4:6}"/>`}
    return svg("right:0;bottom:100%;margin-bottom:-.1em;width:2.2em;height:1.1em","0 0 264 132",h+`<circle class="o p" style="--i:17" cx="14" cy="24" r="11"/>`)},
  // this month, filling in, today solid
  month(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),days=new Date(y,m+1,0).getDate(),start=(new Date(y,m,1).getDay()+6)%7;let h="";
    for(let n=1;n<=days;n++){const c=(start+n-1)%7,r=Math.floor((start+n-1)/7),x=9+c*17,yy=9+r*17,today=n===d.getDate();
      h+=`<circle class="${today?"f":"o"} p" style="--i:${(n*.32).toFixed(2)}" cx="${x}" cy="${yy}" r="${today?7:5.5}"/>`}
    return svg("right:0;bottom:100%;margin-bottom:.1em;width:1.3em;height:1.15em","0 0 120 106",h)},
  // a circle riding a circle
  epicycle(){return svg("left:100%;bottom:0;margin-left:.08em;width:.95em;height:.95em","0 0 114 114",
      `<circle class="o d" pathLength="1" cx="57" cy="57" r="34"/><circle class="f p" cx="57" cy="57" r="3"/>
       <g class="orb"><circle class="o p" style="--i:6" cx="91" cy="57" r="14"/><g class="orb2"><circle class="f p" style="--i:9" cx="105" cy="57" r="4.5"/></g></g>`)},
  // three reels, the light running through them
  reels(){const X=[20,47,74];
    return svg("left:100%;bottom:.1em;margin-left:.14em;width:.96em;height:.4em","0 0 96 40",
      X.map((x,i)=>`<circle class="o k p" style="--i:${i*2+1}" cx="${x}" cy="20" r="17"/>`).join("")+
      X.map((x,i)=>`<circle class="f trig" style="--d:${(i*.53).toFixed(2)}s" cx="${x}" cy="20" r="8"/>`).join(""))},
  // three arcs of sound, pulsing outward
  waves(){const A=["M10 62Q50 40 90 62","M20 40Q50 22 80 40","M30 19Q50 6 70 19"];
    return svg("left:100%;bottom:.1em;margin-left:.12em;width:.8em;height:.58em","0 0 100 72",
      A.map((d,i)=>`<path class="s d wv" pathLength="1" style="--i:${i*2};--d:${(i*.3).toFixed(1)}s;stroke-width:${9-i*1.5}" d="${d}"/>`).join(""))},
  // an open book; its pages turn
  book(){const L="M60 22C46 12 24 10 8 14V70C24 66 46 68 60 78",R="M60 22C74 12 96 10 112 14V70C96 66 74 68 60 78",Q="M60 24C72 15 92 13 106 16V68C92 65 72 66 60 75Z";
    return svg("left:100%;bottom:.06em;margin-left:.14em;width:1em;height:.7em","0 0 120 84",
      `<path class="s d" pathLength="1" style="--i:0" d="${L}"/><path class="s d" pathLength="1" style="--i:0" d="${R}"/><path class="s d" pathLength="1" style="--i:3" d="M60 22V78"/>`+
      [0,1,2].map(i=>`<path class="o k pg" style="--d:${(i*.45).toFixed(2)}s;stroke-width:2.5" d="${Q}"/>`).join(""))},
  // blocks, connected
  blocks(){const B=[[2,90],[34,90],[34,58],[66,58],[66,26],[96,0]];let l="",r="";
    B.forEach((b,i)=>{r+=`<rect class="${i===5?"f":"o"} p" style="--i:${i*1.4}" x="${b[0]}" y="${b[1]}" width="22" height="22"/>`;
      if(i)l+=`<path class="s d" pathLength="1" style="--i:${i}" d="M${B[i-1][0]+11} ${B[i-1][1]+11}L${b[0]+11} ${b[1]+11}"/>`});
    return svg("left:100%;bottom:.04em;margin-left:.12em;width:1.15em;height:1.09em","0 0 120 114",`<g style="opacity:.55">${l}</g>`+r)}
};

/* ---------- the name's plant: measured from the real letters, so it fits any font ---------- */
const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
function ink(font,fs,ch){                    // scan a glyph: per row, the [left,right] of its ink, relative to pen + baseline
  const W=Math.ceil(fs*1.2),H=Math.ceil(fs*1.5),ox=Math.round(fs*.25),oy=Math.round(fs*1.15);
  cv.width=W;cv.height=H;cx.font=font;cx.textBaseline="alphabetic";cx.fillText(ch,ox,oy);
  const d=cx.getImageData(0,0,W,H).data,rows=[];
  for(let y=0;y<H;y++){let l=-1,r=-1;for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>110){if(l<0)l=x;r=x}rows.push(l<0?null:[l-ox,r-ox])}
  const top=rows.findIndex(r=>r);return{rows,oy,top:top<0?-fs*.7:top-oy};
}
function curve(P){                           // a smooth curve through points, + samples of position / heading / arc length
  let d=`M${f1(P[0][0])} ${f1(P[0][1])}`;const S=[];let len=0,prev=null;
  for(let i=0;i<P.length-1;i++){const a=P[i-1]||P[i],b=P[i],c=P[i+1],e=P[i+2]||c;
    const p1=[b[0]+(c[0]-a[0])/6,b[1]+(c[1]-a[1])/6],p2=[c[0]-(e[0]-b[0])/6,c[1]-(e[1]-b[1])/6];
    d+=`C${f1(p1[0])} ${f1(p1[1])} ${f1(p2[0])} ${f1(p2[1])} ${f1(c[0])} ${f1(c[1])}`;
    for(let j=prev?1:0;j<=20;j++){const u=j/20,v=1-u,B=k=>v*v*v*b[k]+3*v*v*u*p1[k]+3*v*u*u*p2[k]+u*u*u*c[k],
        Dv=k=>3*v*v*(p1[k]-b[k])+6*v*u*(p2[k]-p1[k])+3*u*u*(c[k]-p2[k]),x=B(0),y=B(1);
      if(prev)len+=Math.hypot(x-prev.x,y-prev.y);prev={x,y,a:Math.atan2(Dv(1),Dv(0)),s:len};S.push(prev)}}
  S.forEach(p=>p.f=len?p.s/len:0);
  return{d,S,at:f=>S.find(p=>p.f>=f)||S[S.length-1],near:x=>S.reduce((b,p)=>Math.abs(p.x-x)<Math.abs(b.x-x)?p:b)};
}
function plant(node){
  const t=node.querySelector(".t.name"),w=t.querySelector(".w"),cs=getComputedStyle(t),fs=parseFloat(cs.fontSize);
  const font=`${cs.fontStyle} ${cs.fontWeight} ${fs}px ${cs.fontFamily}`,E=v=>v*fs,T=v=>v.toFixed(2)+"s",DG=180/Math.PI;
  const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
  const Ls=[...w.querySelectorAll(".l")].map(s=>({ch:s.textContent,x:s.offsetLeft,w:s.offsetWidth}));
  const yb=w.querySelector(".bl").offsetTop,W=w.offsetWidth,H=w.offsetHeight;

// fit each card's type once per item (not once per card), and grow the plant once per font change
function prep(node){
  const it=node._it,ts=node.querySelectorAll(".t"),fresh=it._fv!==FV;
  if(fresh)it._fs=[...ts].map(t=>{t.style.fontSize="";const w=t.querySelector(".w").scrollWidth;
    return w>it.max?(parseFloat(getComputedStyle(t).fontSize)*it.max/w).toFixed(1)+"px":""});
  ts.forEach((t,j)=>t.style.fontSize=it._fs[j]||"");
  if(it.grow){
    if(fresh){try{it._g=it.grow(node)}catch(e){it._g=null}}
    const v=node.querySelector(".vine");
    if(v&&it._g&&v._fv!==FV){v._fv=FV;v.setAttribute("viewBox",it._g.vb);v.innerHTML=it._g.body;
      if(node._on){node.classList.remove("on");void node.offsetWidth;node.classList.add("on")}}   // replay, don't pop in
  }
  it._fv=FV;node._fv=FV;
}
function make(abs){const it=ITEMS[mod(abs,N)],el=document.createElement("div");el.className="card";el.innerHTML=it._html;el._it=it;return el}

let B=null;
function sync(b){
  const put=(s,n)=>{s.node=n;s.rot.appendChild(n)};
  if(B===null){B=b;slots.forEach(s=>put(s,make(B+s.k)));return}
  if(Math.abs(b-B)>=slots.length){slots.forEach(s=>s.node.remove());B=null;sync(b);return}
  while(B<b){B++;slots[0].node.remove();for(let i=0;i<slots.length-1;i++)put(slots[i],slots[i+1].node);put(slots.at(-1),make(B+slots.at(-1).k))}
  while(B>b){B--;slots.at(-1).node.remove();for(let i=slots.length-1;i>0;i--)put(slots[i],slots[i-1].node);put(slots[0],make(B+slots[0].k))}
}

function fit(){

  S=Math.min(W/(land?PHI:1),H/(land?1:PHI))*.92;
  const d=rot(R0*Math.PI/180,{x:P.x-PHI/2,y:P.y-.5});Ps={x:W/2+S*d.x,y:H/2+S*d.y};
  slots.forEach(s=>s.rot.style.transform=`rotate(${-R0}deg)`);kick()}

  geoG.setAttribute("transform",`matrix(${ca} ${sa} ${-sa} ${ca} ${Ps.x-(ca*P.x-sa*P.y)} ${Ps.y-(sa*P.x+ca*P.y)})`);
  const n=Math.round(t);

    if(started&&!drag&&Number.isInteger(t)){const sl=ITEMS[mod(t,N)].slug,u=sl?"#"+sl:location.pathname+location.search;
      if(u!==(sl?location.hash:location.pathname+location.search+location.hash))history.replaceState(null,"",u)}
    return}
  requestAnimationFrame(frame)}

  Promise.all(["400 236px 'Instrument Serif'","700 120px 'Inter Tight'","400 30px 'IBM Plex Mono'","700 120px 'Noto Naskh Arabic'"]

  document.fonts.addEventListener?.("loadingdone",refit);
}else begin();
setTimeout(begin,900);
})();
</script>
